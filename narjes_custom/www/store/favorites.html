{% extends "templates/storefront/base.html" %}

{% block title %}{{ t.favorites }} · {{ "نرجس" if lang == "ar" else "Narjes" }}{% endblock %}

{% block content %}
<div class="s-wrap s-section">
	<h1 data-reveal>{{ t.favorites }}</h1>

	<div id="s-fav-grid" class="s-grid" style="margin-top:26px"></div>

	<div class="s-empty" id="s-fav-empty">
		<svg style="width:56px;height:56px;opacity:.4;margin:0 auto 14px;display:block" aria-hidden="true">
			<use href="#ph-heart"></use>
		</svg>
		<h3>{{ t.no_results }}</h3>
		<p style="margin-top:10px">
			<a class="s-btn s-btn--ghost" href="/{{ lang }}/shop">{{ t.browse }}</a>
		</p>
	</div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Favourites live in localStorage (no accounts in v1), so the list is resolved
// client-side against the public catalogue endpoint.
document.addEventListener("narjes:ready", function () {
	var LANG = {{ lang | tojson }};
	var grid = document.getElementById("s-fav-grid");
	var empty = document.getElementById("s-fav-empty");

	function render() {
		var codes = Narjes.favorites.all();
		if (!codes.length) { grid.innerHTML = ""; empty.style.display = ""; return; }
		empty.style.display = "none";
		grid.innerHTML = '<div class="s-skel" style="height:300px"></div>'.repeat(Math.min(codes.length, 4));

		Narjes.api("narjes_custom.storefront.api.get_items", {
			item_codes: JSON.stringify(codes), lang: LANG
		}).then(function (rows) {
			rows = rows || [];
			grid.innerHTML = rows.map(function (p) { return p.html; }).join("");
			if (!rows.length) empty.style.display = "";
		}).catch(function () {
			grid.innerHTML = "";
			empty.style.display = "";
		});
	}

	// re-render when an item is un-favourited from within this page
	var last = Narjes.favorites.all().join(",");
	document.addEventListener("narjes:store-changed", function () {
		var now = Narjes.favorites.all().join(",");
		if (now !== last) { last = now; render(); }
	});
	render();
});
</script>
{% endblock %}
