exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "narjes_custom.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      # ruff-format is deliberately disabled, not removed.
      #
      # It has never actually run on this repo — pre-commit was configured but
      # the hook was never installed, so 57 lint findings had accumulated in
      # committed code. Installing the hooks on 2026-09-08 and running this one
      # reformatted 50 files in a single pass.
      #
      # That reformat may well be worth doing. It is not worth doing *by
      # accident*, mixed into somebody's next bugfix commit, on a codebase
      # whose money paths have no test coverage. Enable it deliberately, run it
      # on its own branch, and land it as one reviewable "reformat everything"
      # commit with nothing else in it.
      # - id: ruff-format
      #   name: "Run ruff formatter"

# ---------------------------------------------------------------- node hooks
#
# prettier and eslint are disabled, for two reasons.
#
# 1. They cannot install on a current machine. Both pre-commit/mirrors-* repos
#    were archived upstream in 2024 and install their tool from a `git+file://`
#    URL. npm 11 refuses non-root git packages outright (EALLOWGIT), so
#    `pre-commit install` succeeds and then *every* commit fails with a
#    network-shaped error unrelated to the change being made. Blocking every
#    commit is strictly worse than not running prettier.
#
# 2. Neither has ever actually run here, so the first successful run would
#    reformat every .js and .scss file at once — the same trap as ruff-format.
#
# To bring them back: switch to maintained forks (rbubley/mirrors-prettier, and
# a modern rev of mirrors-eslint), run them once on their own branch, and land
# that as a reformat-only commit with nothing else in it.
#
