<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Narjes vine — petal curves from the logo mark, tiled as a loose diagonal
       vine with three-petal blooms at intersections. Stroke-only, 1.25px,
       full-opacity fern-600 strokes — per-surface strength is set in CSS via opacity on the pattern layer (masthead 3–4%, login stronger), per plan P1.5. -->
  <defs>
    <g id="bloom" fill="none" stroke="#2E5C46" stroke-width="1.25" stroke-linecap="round">
      <path d="M0 0 C -5 -10, -2 -20, 0 -26 C 2 -20, 5 -10, 0 0 Z"/>
      <path d="M0 0 C -5 -10, -2 -20, 0 -26 C 2 -20, 5 -10, 0 0 Z" transform="rotate(120)"/>
      <path d="M0 0 C -5 -10, -2 -20, 0 -26 C 2 -20, 5 -10, 0 0 Z" transform="rotate(-120)"/>
      <circle cx="0" cy="0" r="2.5"/>
    </g>
  </defs>
  <g fill="none" stroke="#2E5C46" stroke-width="1.25" stroke-linecap="round">
    <path d="M -40 520 C 80 400, 60 320, 160 240 C 260 160, 240 80, 360 -40"/>
    <path d="M 120 560 C 240 440, 220 360, 320 280 C 420 200, 400 120, 520 0"/>
    <path d="M -120 360 C 0 240, -20 160, 80 80 C 180 0, 160 -80, 280 -200"/>
    <path d="M 160 240 C 190 230, 210 240, 224 260"/>
    <path d="M 320 280 C 350 270, 370 280, 384 300"/>
    <path d="M 80 80 C 110 70, 130 80, 144 100"/>
  </g>
  <use href="#bloom" transform="translate(160 240) rotate(15)"/>
  <use href="#bloom" transform="translate(320 280) rotate(-20)"/>
  <use href="#bloom" transform="translate(80 80) rotate(30)"/>
  <use href="#bloom" transform="translate(420 120) rotate(-10)"/>
  <use href="#bloom" transform="translate(240 440) rotate(5)"/>
</svg>
